name: Update CFC Fixtures

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2,8,14,20 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install packages
        run: pip install requests pandas lxml

      - name: Update CFC calendar
        run: python update_calendar.py

      - name: Save updated fixtures
        run: |
          git config user.name "CFC Fixture Bot"
          git config user.email "actions@users.noreply.github.com"
          git add fixtures.ics status.json
          git diff --cached --quiet || git commit -m "Update CFC fixtures"
          git push
